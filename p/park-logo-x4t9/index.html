<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Park Aesthetics: logo</title>
<style>
@font-face{font-family:"Times Now";src:url(../_a/times-now-extralight.woff) format("woff");font-weight:200;font-style:normal;font-display:swap}
@font-face{font-family:"Times Now";src:url(../_a/times-now-extralight-italic.woff) format("woff");font-weight:200;font-style:italic;font-display:swap}
@font-face{font-family:"Avenir Roman";src:url(../_a/avenir-roman.ttf) format("truetype");font-weight:400;font-style:normal;font-display:swap}
:root{--bg:#fcfcfa;--card:#ffffff;--line:#e4e0d8;--ink:#000;--head:#333;--mute:#7a756c;--sel:#2B201B;--gut:clamp(16px,5vw,72px)}
*{box-sizing:border-box;margin:0}
html{background:var(--bg)}
body{background:var(--bg);color:var(--ink);font-family:"Avenir Roman",Helvetica,Arial,sans-serif;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
header{display:flex;justify-content:space-between;align-items:center;padding:22px var(--gut);border-bottom:1px solid var(--line)}
header img{height:22px;display:block}
.tag{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--head)}
main{max-width:1180px;overflow-x:hidden;margin:0 auto;padding:40px var(--gut) 120px}
.prog{display:flex;gap:6px;margin-bottom:34px}
.prog i{flex:1;height:3px;background:var(--line);border-radius:2px}
.prog i.on{background:var(--sel)}
.kicker{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin-bottom:12px}
h1{font-family:"Times Now",Georgia,serif;font-weight:200;font-size:clamp(34px,5vw,56px);line-height:1.08;letter-spacing:-.01em;color:var(--ink);margin-bottom:12px}
.lead{color:var(--head);max-width:640px;margin-bottom:30px}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.grid.cols{grid-auto-flow:column}
.grid.one{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.colhead{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);padding:2px 2px 0}
.opt{min-width:0;width:100%;position:relative;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 10px 12px;cursor:pointer;text-align:left;font:inherit;color:inherit;transition:border-color .15s,box-shadow .15s}
.opt:hover{border-color:#bdb6aa}
.opt svg{display:block;width:100%;height:auto}
.opt .meta{display:flex;justify-content:space-between;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);padding:4px 6px 0}
.opt.sel{border-color:var(--sel);box-shadow:0 0 0 2px var(--sel) inset}
.opt.sel .meta b{color:var(--sel)}
.opt .pick{display:none;position:absolute;top:10px;right:10px;background:var(--sel);color:#fcfcfa;font-size:11px;letter-spacing:.12em;text-transform:uppercase;padding:4px 10px;border-radius:20px}
.opt.sel .pick{display:block}
.color .opt{padding:0;overflow:hidden}
.color .opt .meta{padding:10px 14px 4px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-top:22px}
.none{background:none;border:1px solid var(--line);border-radius:30px;padding:10px 18px;font:inherit;font-size:14px;cursor:pointer;color:var(--head)}
.none.sel{border-color:var(--sel);background:var(--sel);color:#fcfcfa}
textarea{width:100%;min-height:70px;margin-top:16px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:#fff;font:inherit;font-size:15px;resize:vertical;color:var(--ink)}
textarea::placeholder{color:#a39d92}
nav.bar{position:fixed;left:0;right:0;bottom:0;background:rgba(252,252,250,.96);border-top:1px solid var(--line);padding:14px var(--gut);display:flex;justify-content:space-between;align-items:center;gap:12px;z-index:5}
.btn{background:var(--sel);color:#fcfcfa;border:0;border-radius:30px;padding:13px 28px;font:inherit;font-size:15px;cursor:pointer}
.btn:disabled{opacity:.35;cursor:default}
.ghost{background:none;border:0;font:inherit;font-size:15px;color:var(--head);cursor:pointer;padding:13px 4px}
.hint{font-size:13px;color:var(--mute)}
.sum{display:grid;gap:10px;margin:10px 0 26px}
.sum .it{display:grid;grid-template-columns:200px 1fr;gap:16px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.sum .it svg{width:100%;height:auto;display:block}
.sum .t{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.sum .v{font-size:14px;color:var(--head)}
.sum .edit{background:none;border:0;color:var(--mute);text-decoration:underline;font:inherit;font-size:13px;cursor:pointer;padding:0}
.err{color:#9a2b1e;font-size:14px;margin-top:10px}
@media(max-width:720px){.grid,.grid.one{grid-template-columns:minmax(0,1fr)}.grid.cols{grid-template-rows:none!important}.tag{display:none}h1{overflow-wrap:break-word}.grid.cols{grid-auto-flow:row}.sum .it{grid-template-columns:110px 1fr}.colhead{display:none}}
</style>
</head>

const SHEET = "https://script.google.com/macros/s/AKfycbzt2e2AMMLavPoxm3TWsy7WZSk3vsbq_eCvkcLtYpANeAHeRiWnom620PdjxdLFUANTig/exec";
const KEY = "park-logo-test-v1";
let st = {i:-1, pick:{}, none:{}, note:{}, final:"", sent:false};
try{const s=JSON.parse(localStorage.getItem(KEY)); if(s&&!s.sent) st=Object.assign(st,s);}catch(e){}
const _q=new URLSearchParams(location.search); if(_q.get('s')!==null){st.i=+_q.get('s'); }
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}};
const app=document.getElementById('app'), bar=document.getElementById('bar');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function prog(){return '<div class="prog">'+STEPS.map((_,k)=>'<i class="'+(k<=st.i?'on':'')+'"></i>').join('')+'</div>'}
function intro(){
  app.innerHTML='<div class="kicker">Park Aesthetics</div><h1>Which logo feels most like Park?</h1>'+
  '<p class="lead">There are '+STEPS.length+' short questions. Each one changes a single thing about the logo. Tap the version you like most. If none of them feels right, choose "None of these". Your answers come straight to us when you press Send at the end.</p>';
  bar.innerHTML='<span class="hint">About 5 minutes</span><button class="btn" id="go">Start</button>';
  document.getElementById('go').onclick=()=>{st.i=0;save();render()};
}
function step(){
  const s=STEPS[st.i], k=String(st.i);
  const two = s.kind==='logo' && s.opts.length>2 && s.opts.every(o=>o.side) ;
  const isColor = s.kind==='color';
  let g='';
  if(two){
    const half=s.opts.length/2;
    g='<div class="grid cols" style="grid-template-rows:auto repeat('+half+',auto)"><div class="colhead">Sans</div>'+
      s.opts.slice(0,half).map(card).join('')+'<div class="colhead">Serif</div>'+s.opts.slice(half).map(card).join('')+'</div>';
  } else {
    g='<div class="grid'+(isColor?' one':'')+'">'+s.opts.map(card).join('')+'</div>';
  }
  app.innerHTML=prog()+'<div class="kicker">'+(st.i+1)+' / '+STEPS.length+' · '+esc(s.title)+'</div><h1>'+esc(s.q)+'</h1>'+
    '<p class="lead">'+(isColor?'Each card shows the whole palette with one new deep brown. Tap the one that feels right.':'Tap the one you like most.')+'</p>'+
    '<div class="'+(isColor?'color':'')+'">'+g+'</div>'+
    '<div class="row"><button class="none'+(st.none[k]?' sel':'')+'" id="none">None of these feel right</button></div>'+
    '<textarea id="note" placeholder="Anything to add? (optional)">'+esc(st.note[k]||'')+'</textarea>';
  function card(o){return '<button class="opt'+(st.pick[k]===o.id?' sel':'')+'" data-id="'+o.id+'"><span class="pick">Your pick</span>'+o.svg+
    '<span class="meta"><b>'+esc(o.label)+'</b><span>'+esc(o.cap)+'</span></span></button>'}
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{st.pick[k]=b.dataset.id;delete st.none[k];save();render(true)});
  document.getElementById('none').onclick=()=>{st.none[k]=!st.none[k];if(st.none[k])delete st.pick[k];save();render(true)};
  document.getElementById('note').oninput=e=>{st.note[k]=e.target.value;save()};
  const ok = st.pick[k]||st.none[k];
  bar.innerHTML='<button class="ghost" id="back">Back</button><button class="btn" id="next"'+(ok?'':' disabled')+'>'+(st.i===STEPS.length-1?'Review':'Next')+'</button>';
  document.getElementById('back').onclick=()=>{st.i--;save();render()};
  document.getElementById('next').onclick=()=>{st.i++;save();render()};
}
function answer(k){
  const s=STEPS[k]; const id=st.pick[String(k)];
  if(id){const o=s.opts.find(x=>x.id===id);return {o, txt:'#'+o.label+' '+o.cap+(o.side?' ('+o.side+')':'')};}
  return {o:null, txt:st.none[String(k)]?'None of these':'(skipped)'};
}
function review(){
  app.innerHTML=prog()+'<div class="kicker">Almost done</div><h1>Your picks</h1><p class="lead">Check them over, add anything you like, then press Send.</p><div class="sum">'+
  STEPS.map((s,k)=>{const a=answer(k);return '<div class="it"><div>'+(a.o?a.o.svg:'')+'</div><div><div class="t">'+esc(s.title)+'</div><div class="v">'+esc(a.txt)+
    (st.note[k]?'<br><i>'+esc(st.note[k])+'</i>':'')+'</div><button class="edit" data-k="'+k+'">Change</button></div></div>'}).join('')+
  '</div><textarea id="final" placeholder="Anything else you\'d like us to know? (optional)">'+esc(st.final)+'</textarea><div class="err" id="err"></div>';
  app.querySelectorAll('.edit').forEach(b=>b.onclick=()=>{st.i=+b.dataset.k;save();render()});
  document.getElementById('final').oninput=e=>{st.final=e.target.value;save()};
  bar.innerHTML='<button class="ghost" id="back">Back</button><button class="btn" id="send">Send to Owlsome</button>';
  document.getElementById('back').onclick=()=>{st.i=STEPS.length-1;save();render()};
  document.getElementById('send').onclick=send;
}
async function send(){
  const b=document.getElementById('send'); b.disabled=true; b.textContent='Sending…';
  const p={_brand:'Park Aesthetics: logo test',_lang:'EN',_submitted:new Date().toISOString()};
  STEPS.forEach((s,k)=>{p[String(k+1).padStart(2,'0')+' '+s.title]=answer(k).txt+(st.note[k]?' | Note: '+st.note[k]:'');});
  if(st.final) p['99 Anything else']=st.final;
  try{
    await fetch(SHEET,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(p)});
    st.sent=true; save(); done();
  }catch(e){
    b.disabled=false; b.textContent='Send to Owlsome';
    document.getElementById('err').textContent='Something went wrong while sending. Please try again, or reply to our email and we will sort it out.';
  }
}
function done(){
  app.innerHTML='<div class="kicker">Thank you</div><h1>Got it, thank you!</h1><p class="lead">Your picks are with us. We\'ll go through them and come back with the next version of the logo.</p>';
  bar.innerHTML='';
}
function render(keep){
  const y=window.scrollY;
  if(st.sent) return done();
  if(st.i<0) intro(); else if(st.i>=STEPS.length) review(); else step();
  if(keep) window.scrollTo(0,y); else window.scrollTo(0,0);
}
render();
</script>
